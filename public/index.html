<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiPedia — The Free Encyclopedia</title>
    <meta
      name="description"
      content="WikiPedia is a free collaborative encyclopedia. Read, search, create, and edit articles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d3b2e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' font-family='Georgia' fill='%23e8c547'%3EW%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="WikiPedia home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-text">WikiPedia</span>
        </a>

        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="search-input">Search WikiPedia</label>
          <input
            id="search-input"
            type="search"
            name="q"
            placeholder="Search articles…"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-ghost">Search</button>
          <div class="search-suggest" id="search-suggest" hidden></div>
        </form>

        <nav class="main-nav" aria-label="Primary">
          <a href="#/">Home</a>
          <a href="#/random">Random</a>
          <a href="#/create">Create</a>
          <a href="#/recent">Recent</a>
          <a href="#/categories">Categories</a>
        </nav>

        <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p><strong>WikiPedia</strong> — a free encyclopedia anyone can edit.</p>
        <p class="muted">Built with JavaScript · Content saved on this server</p>
      </div>
    </footer>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
