<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oravexa — The Free Encyclopedia</title>
    <meta
      name="description"
      content="Oravexa is a free collaborative encyclopedia. Read, search, create, and edit articles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script>
      (() => {
        const saved =
          localStorage.getItem("oravexaTheme") ||
          localStorage.getItem("wikiTheme");
        const theme = saved === "dark" || saved === "light" ? saved : "light";
        document.documentElement.setAttribute("data-theme", theme);
        const lang = localStorage.getItem("oravexaLang") === "es" ? "es" : "en";
        document.documentElement.setAttribute("lang", lang);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="Oravexa home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false">
              <path
                class="logo-book"
                d="M10 16.5c7.2-.8 14.2-3.5 22-3.5s14.8 2.7 22 3.5v33c-7.2-.9-14.2-3.6-22-3.6s-14.8 2.7-22 3.6v-33z"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linejoin="round"
              />
              <path
                class="logo-spine"
                d="M32 13v32.4"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path
                class="logo-x"
                d="M25 27.5 L39 41.5 M39 27.5 L25 41.5"
                stroke="currentColor"
                stroke-width="3.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="brand-text">Oravexa</span>
        </a>

        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="search-input">Search Oravexa</label>
          <input
            id="search-input"
            type="search"
            name="q"
            placeholder="Search articles…"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-ghost">Search</button>
          <div class="search-suggest" id="search-suggest" hidden></div>
        </form>

        <div class="header-actions">
          <button
            type="button"
            class="lang-toggle"
            id="lang-toggle"
            aria-label="Switch language to Spanish"
            title="Switch language to Spanish"
          >
            Español
          </button>

          <button
            type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Switch to black theme"
            title="Toggle black / white"
          >
            <span class="theme-icon" aria-hidden="true"></span>
          </button>

          <nav class="main-nav" aria-label="Primary">
            <a href="#/">Home</a>
            <a href="#/random">Random</a>
            <a href="#/create">Create</a>
            <a href="#/recent">Recent</a>
            <a href="#/categories">Categories</a>
          </nav>

          <div class="auth-nav" id="auth-nav" aria-live="polite"></div>

          <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p><strong>Oravexa</strong> — a free encyclopedia anyone can edit.</p>
        <p class="muted">Built with JavaScript · Content saved on this server</p>
      </div>
    </footer>

    <script src="/js/i18n.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
