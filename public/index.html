<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oravexa — The Free Encyclopedia</title>
    <meta
      name="description"
      content="Oravexa is a free collaborative encyclopedia. Read, search, create, and edit articles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script>
      (() => {
        const saved =
          localStorage.getItem("oravexaTheme") ||
          localStorage.getItem("wikiTheme");
        const theme = saved === "dark" || saved === "light" ? saved : "light";
        document.documentElement.setAttribute("data-theme", theme);
        const lang = localStorage.getItem("oravexaLang") === "es" ? "es" : "en";
        document.documentElement.setAttribute("lang", lang);
      })();
    </script>
  </head>
  <body class="auth-locked">
    <a class="skip-link" href="#app">Skip to content</a>

    <div id="auth-screen" class="auth-screen" hidden>
      <div class="auth-panel">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false">
              <path
                class="logo-book"
                d="M10 16.5c7.2-.8 14.2-3.5 22-3.5s14.8 2.7 22 3.5v33c-7.2-.9-14.2-3.6-22-3.6s-14.8 2.7-22 3.6v-33z"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linejoin="round"
              />
              <path
                class="logo-spine"
                d="M32 13v32.4"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path
                class="logo-x"
                d="M25 27.5 L39 41.5 M39 27.5 L25 41.5"
                stroke="currentColor"
                stroke-width="3.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <div>
            <p class="auth-product">Oravexa</p>
            <p class="auth-tagline" id="auth-tagline">Sign in to continue</p>
          </div>
        </div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab is-active" id="tab-login" data-auth-tab="login">
            Sign in
          </button>
          <button type="button" class="auth-tab" id="tab-register" data-auth-tab="register">
            Create account
          </button>
        </div>

        <div id="auth-message" class="auth-message" hidden></div>

        <form id="login-form" class="auth-form" autocomplete="on">
          <div class="form-field">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" required autocomplete="username" />
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              minlength="6"
            />
          </div>
          <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
        </form>

        <form id="register-form" class="auth-form" hidden autocomplete="on">
          <div class="form-field">
            <label for="register-display">Display name</label>
            <input id="register-display" name="displayName" autocomplete="nickname" />
          </div>
          <div class="form-field">
            <label for="register-username">Username</label>
            <input id="register-username" name="username" required autocomplete="username" minlength="3" />
          </div>
          <div class="form-field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              required
              autocomplete="new-password"
              minlength="6"
            />
          </div>
          <button class="btn btn-primary auth-submit" type="submit">Create account</button>
        </form>

        <p class="auth-note" id="auth-note">
          Your session stays signed in on this device when you come back.
        </p>

        <div class="auth-tools">
          <button
            type="button"
            class="lang-toggle"
            id="auth-lang-toggle"
            aria-label="Switch language to Spanish"
          >
            Español
          </button>
          <button
            type="button"
            class="theme-toggle"
            id="auth-theme-toggle"
            aria-label="Switch to black theme"
            title="Toggle black / white"
          >
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <div id="app-shell" class="app-shell" hidden>
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="#/" aria-label="Oravexa home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path
                  class="logo-book"
                  d="M10 16.5c7.2-.8 14.2-3.5 22-3.5s14.8 2.7 22 3.5v33c-7.2-.9-14.2-3.6-22-3.6s-14.8 2.7-22 3.6v-33z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
                <path
                  class="logo-spine"
                  d="M32 13v32.4"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <path
                  class="logo-x"
                  d="M25 27.5 L39 41.5 M39 27.5 L25 41.5"
                  stroke="currentColor"
                  stroke-width="3.4"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand-text">Oravexa</span>
          </a>

          <form class="search-form" id="search-form" role="search">
            <label class="sr-only" for="search-input">Search Oravexa</label>
            <input
              id="search-input"
              type="search"
              name="q"
              placeholder="Search articles…"
              autocomplete="off"
            />
            <button type="submit" class="btn btn-ghost">Search</button>
            <div class="search-suggest" id="search-suggest" hidden></div>
          </form>

          <div class="header-actions">
            <div class="user-chip" id="user-chip" hidden>
              <span class="user-chip-name" id="user-chip-name"></span>
              <button type="button" class="btn btn-ghost logout-btn" id="logout-btn">
                Log out
              </button>
            </div>

            <button
              type="button"
              class="lang-toggle"
              id="lang-toggle"
              aria-label="Switch language to Spanish"
              title="Switch language to Spanish"
            >
              Español
            </button>

            <button
              type="button"
              class="theme-toggle"
              id="theme-toggle"
              aria-label="Switch to black theme"
              title="Toggle black / white"
            >
              <span class="theme-icon" aria-hidden="true"></span>
            </button>

            <nav class="main-nav" aria-label="Primary">
              <a href="#/">Home</a>
              <a href="#/random">Random</a>
              <a href="#/create">Create</a>
              <a href="#/recent">Recent</a>
              <a href="#/categories">Categories</a>
            </nav>

            <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
          </div>
        </div>
      </header>

      <main id="app" class="app" tabindex="-1"></main>

      <footer class="site-footer">
        <div class="footer-inner">
          <p><strong>Oravexa</strong> — a free encyclopedia anyone can edit.</p>
          <p class="muted">Built with JavaScript · Content saved on this server</p>
        </div>
      </footer>
    </div>

    <script src="/js/i18n.js" defer></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
